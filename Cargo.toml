[package]
name = "tokio-go"
version = "0.3.0"
edition = "2021"
rust-version = "1.71"
authors = ["chang"]
description = "Run async closures on reusable profile-dedicated Tokio runtimes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhchang/tokio-go"
readme = "README.md"
keywords = ["async", "macro", "runtime", "tokio"]
categories = ["asynchronous", "concurrency"]

[dependencies]
tokio = { version = "1.53.0", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.0", default-features = false, features = ["macros", "test-util"] }
